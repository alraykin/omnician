# Cloud iOS build for Omnician. Runs on GitHub-hosted macOS (no Mac on our side).
# Free GitHub Actions minutes only — do not add paid runners or Codemagic.
#
# App Store Connect requires a current iOS SDK. Both jobs use GitHub's
# Xcode 27 image (`runs-on: xcode-27` — not macos-26). That image's newest
# Xcode is 27.2 (Swift 6.4 / iOS 27.2 SDK), so `#if compiler(>=6.4)` hinge
# and crease paths compile. Deployment target stays iOS 15.0; hinge calls
# are still behind `if #available(iOS 27.1, *)`.
# TestFlight stays off until IOS_TESTFLIGHT_ENABLED is true.
#
# Do not pass PRODUCT_BUNDLE_IDENTIFIER on the xcodebuild command line — that
# stamps app.omnician onto embedded Capacitor/Cordova frameworks.

name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Unsigned iPhone simulator
    runs-on: xcode-27
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select newest Xcode on this image
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos|iphonesimulator' || true
          xcrun simctl list runtimes

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm packages
        run: npm ci

      - name: Check iOS project files (no signing)
        run: npm run test:ios-prep && npm run test:audio-session

      - name: Check Factory CORS and native sound sources
        run: npm run test:factory && npm run test:sound-sources && npm run test:fold && npm run test:pendulum && npm run test:precount

      - name: Production web build (Vite dist → Capacitor webDir)
        run: npm run build

      - name: Copy web assets into the iOS project
        run: npx cap sync ios

      - name: Install CocoaPods (Capacitor iOS)
        working-directory: ios/App
        run: pod install

      - name: Compile unsigned for iPhone simulator
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            build

      - name: Launch-smoke on iPhone simulator
        continue-on-error: true
        run: bash scripts/ios-sim-launch-smoke.sh ios/App/DerivedData

  testflight:
    name: Archive and upload to TestFlight
    # Smoke is continue-on-error on the simulator job; this job only needs the
    # compile to have succeeded, not a green launch-smoke step.
    needs: simulator
    if: ${{ vars.IOS_TESTFLIGHT_ENABLED == 'true' }}
    runs-on: xcode-27
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select newest Xcode on this image
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos|iphonesimulator' || true
          xcrun simctl list runtimes

      - name: Stop if Apple secrets are missing
        run: |
          missing=0
          for name in APPLE_TEAM_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set IOS_TESTFLIGHT_ENABLED only after every Apple secret exists. See docs/ios-native.md."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm packages
        run: npm ci

      - name: Production web build
        run: npm run build

      - name: Copy web assets into the iOS project
        run: npx cap sync ios

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo "AUTH_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Install CocoaPods (Capacitor iOS)
        working-directory: ios/App
        run: pod install

      # Archive unsigned so Xcode never asks for an iOS Development profile
      # (those require a registered device; this team has none). Signing happens
      # only at export, with Apple Distribution + an App Store profile.
      # Bundle id lives only on the App target in the Xcode project — do not pass
      # PRODUCT_BUNDLE_IDENTIFIER here or embedded pods inherit app.omnician.
      - name: Archive for App Store
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Omnician.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            archive

      - name: Check nested bundle identifiers
        run: bash scripts/ios-check-bundle-ids.sh "$RUNNER_TEMP/Omnician.xcarchive"

      - name: Export IPA
        run: |
          cp ios/exportOptions.plist "$RUNNER_TEMP/exportOptions.plist"
          /usr/bin/sed -i '' "s/APPLE_TEAM_ID_PLACEHOLDER/${APPLE_TEAM_ID}/" "$RUNNER_TEMP/exportOptions.plist"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Omnician.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
        run: |
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -n 1)
          if [ -z "$IPA" ]; then
            echo "No IPA in $RUNNER_TEMP/export" >&2
            ls -la "$RUNNER_TEMP/export" >&2 || true
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
